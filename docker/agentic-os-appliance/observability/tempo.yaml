auth_enabled: false
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 13200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 19095
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 127.0.0.1:14327
        http:
          endpoint: 127.0.0.1:14328
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 24h
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
usage_report:
  reporting_enabled: false
memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 17946
