extensions:
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    timeout: 5s
    send_batch_size: 2048
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      storage: file_storage
      queue_size: 10000
    retry_on_failure:
      max_elapsed_time: 0s
  awss3/archive:
    s3uploader:
      region: ${env:AWS_REGION}
      s3_bucket: ${env:GARE2E_S3_BUCKET}
      s3_prefix: ${env:GARE2E_S3_PREFIX}/otlp
      compression: gzip
    marshaler: otlp_json
    sending_queue:
      enabled: true
      storage: file_storage
      queue_size: 10000
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
service:
  extensions: [file_storage, health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, awss3/archive]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, awss3/archive]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [awss3/archive]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
