apiVersion: 1
datasources:
  - name: gare2e Prometheus
    uid: gare2e-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:19090
    isDefault: true
  - name: gare2e Tempo
    uid: gare2e-tempo
    type: tempo
    access: proxy
    url: http://127.0.0.1:13200
    jsonData:
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: gare2e-prometheus
