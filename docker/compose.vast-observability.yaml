# Standalone central companion. The GPU appliance runs separately on Vast.
# Paths are relative to the repository root: use --project-directory .
services:
  tempo:
    image: grafana/tempo:2.7.2
    user: "0:0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./examples/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:${GARE2E_OBSERVER_TEMPO_PORT:-23200}:3200"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    user: "0:0"
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./docker/agentic-os-appliance/observability/vast/collector.yaml:/etc/otel-collector.yaml:ro
      - collector-data:/var/lib/otelcol
    ports:
      - "127.0.0.1:${GARE2E_OBSERVER_OTLP_GRPC_PORT:-24317}:4317"
      - "127.0.0.1:${GARE2E_OBSERVER_OTLP_HTTP_PORT:-24318}:4318"
    depends_on: [tempo]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./examples/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./examples/observability/prometheus-rules.yml:/etc/prometheus/seocho-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${GARE2E_OBSERVER_PROMETHEUS_PORT:-29090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    # File-backed Compose secrets retain host permissions on Linux. Read the
    # operator's 0600 file without making it world-readable or changing ownership.
    user: "0:0"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets: [grafana_password]
    volumes:
      - ./docker/agentic-os-appliance/observability/vast/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GARE2E_OBSERVER_GRAFANA_PORT:-23000}:3000"
    depends_on: [prometheus, tempo]
    restart: unless-stopped

secrets:
  grafana_password:
    file: ${GARE2E_GRAFANA_PASSWORD_FILE:?Set an absolute path to the private Grafana password file}

volumes:
  tempo-data:
  collector-data:
  prometheus-data:
  grafana-data:
